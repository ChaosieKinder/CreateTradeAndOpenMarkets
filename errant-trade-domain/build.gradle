// The economy without Minecraft: denominations, purses, money formatting, the coin pile's layout.
// It declares no Minecraft dependency, which is what makes "no Minecraft here" a compile error
// rather than a review comment (AGENTS §2). Its classes ship inside the mod's jar.
plugins {
    id 'java-library'
}

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

dependencies {
    testImplementation(platform("org.junit:junit-bom:${junit_version}"))
    testImplementation("org.junit.jupiter:junit-jupiter")
    testRuntimeOnly("org.junit.platform:junit-platform-launcher")
}

tasks.named('test', Test) {
    useJUnitPlatform()
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}
